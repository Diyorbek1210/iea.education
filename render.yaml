services:
  - type: web
    name: fluent-path
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build && ln -s .output dist
    startCommand: node .output/server/index.mjs
    nodeVersion: 24.18.0
    envVars:
      - key: NODE_ENV
        value: production
      - key: NITRO_PRESET
        value: node-server
